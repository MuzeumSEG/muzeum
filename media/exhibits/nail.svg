<polygon points="150,370 210,362 210,438 150,430" fill="#3b3733"/>
<polygon points="150,370 210,362 200,352 140,360" fill="#55504a"/>
<polygon points="210,382 640,396 680,400 640,404 210,418" fill="#4a4540"/>
